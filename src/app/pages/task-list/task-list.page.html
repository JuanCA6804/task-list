<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center ion-title-bold">
      Mis tareas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-input
      type="text"
      placeholder="Nueva Tarea"
      name="task"
      [(ngModel)]="task">
    </ion-input>
    
    <ion-button (click)="addTask()" [disabled]="!task">
      <ion-icon name="add-outline"></ion-icon>
    </ion-button>
  </ion-item>

  <!---IonList: Contenedor de elementos de lista, que puede contener elementos de lista (ion-item) y otros componentes relacionados con la lista. Se utiliza para mostrar una lista de elementos en la interfaz de usuario.-->
  <ion-list>
    @if(tasks.length === 0) {
      <ion-item>
        <ion-label class="ion-text-center">No hay tareas pendientes.</ion-label>
      </ion-item>
    } @else {
      <ion-reorder-group [disabled]="false" (ionItemReorder)="handleReorderEnd($any($event))">
        <!---track task: Le indica a Angular cómo identificar de manera única cada elemento de la lista , DOM (Document Objet Model ) de forma eficiente -->
        @for (task of tasks; track task) {
          <ion-item-sliding>
            <ion-item>
              <ion-label>{{ task }}</ion-label>
              <!-- Ícono de tres líneas para agarrar y arrastrar -->
              <ion-reorder slot="end"></ion-reorder>
            </ion-item>

            <ion-item-options side="end">
              <ion-item-option color="danger" (click)="confirmDeleteTask(task)">
                <ion-icon slot="icon-only" name="trash"></ion-icon>
              </ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        }
      </ion-reorder-group>
    }
  </ion-list>
</ion-content>
